<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1a56db" />
		<!-- sets the light/dark theme before the first paint (own file: the CSP allows no inline script) -->
		<script src="./theme-init.js"></script>
<!-- An explicit icon link saves the browser's implicit /favicon.ico
		     request, which answered 404 in the console otherwise. -->
		<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
		<!-- iOS: start from the home screen as an app (standalone), with a short name below the icon -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="E-Invoices" />
		<title>E-Invoices</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
