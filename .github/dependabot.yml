version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Spread-out cron instead of "monthly": the repository checker asks for a
      # randomized schedule so that not every adapter queries the registry at
      # the same minute (S8906).
      interval: "cron"
      cronjob: "13 4 3 * *"
      timezone: Europe/Berlin
    cooldown:
      default: 7
    open-pull-requests-limit: 15
    assignees:
      - sadam6752-tech
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/src-www"
    schedule:
      interval: "cron"
      cronjob: "41 5 11 * *"
      timezone: Europe/Berlin
    cooldown:
      default: 7
    open-pull-requests-limit: 15
    assignees:
      - sadam6752-tech

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "7 6 19 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - sadam6752-tech
