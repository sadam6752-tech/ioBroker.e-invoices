name: E2E (Playwright)

# The browser tests run against `test/e2e/server.mjs`: it starts the real API on a throwaway data directory and
# serves the built web app, so no ioBroker instance is needed. One browser and one runner are enough — Linux only.
on:
  push:
    branches:
      - "main"
  pull_request: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # The official actions in version 7 run on Node 24; `@v4` still targets the deprecated Node 20
      # and GitHub logs a warning for every run with it.
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install the adapter
        run: npm ci

      # `npm run build` compiles the adapter **and** builds the web app into `www/`,
      # which is exactly what the harness serves — a broken bundle fails here as well.
      - name: Build the adapter and the web app
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
