name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          type-checking: true
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: check-and-lint
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      # a single flaky runner must not cancel the other jobs — all results are wanted
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true
          # The action only runs unit tests when it finds a script matching
          # `unit-test-check-pattern` — the default is `test:unit`, which this
          # adapter does not have, so without the two lines below the matrix would
          # be green without running one of the 225 tests. The package tests belong
          # here as well; the repo checker expects them in the test run.
          unit-test-check-pattern: "test:ts"
          unit-test-command: "npm run test:ts && npm run test:api && npm run test:pwa && npm run test:package"

# Deploys the final package to npm — only on a pushed version tag (e.g. v0.0.1),
# never on a branch push.
#
# Prerequisite, outside this repository: a trusted publisher for the package
# `iobroker.e-invoices` in the npm package settings
# (https://docs.npmjs.com/trusted-publishers). The job authenticates through
# OIDC (`id-token: write`), so no NPM_TOKEN secret is used here, and npm
# generates the provenance statement.
# Do not push a `v*` tag before that is configured: the job would fail (nothing
# gets published, but the release run turns red). The release order is written
# down in PROJECT_STATUS.md, section 5.

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Write permissions are required to create Github releases
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          # The checker requires at least Node 24 for the publishing job (E3022).
          node-version: '24.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Sentry is not used by this adapter, so the block stays disabled.
          # To enable error reporting, add the SENTRY_AUTH_TOKEN secret and uncomment:
          # sentry: true
          # sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # sentry-project: "iobroker-e-invoices"
          # sentry-version-prefix: "iobroker.e-invoices"
          # sentry-sourcemap-paths: "build/"
          # sentry-github-integration: true
