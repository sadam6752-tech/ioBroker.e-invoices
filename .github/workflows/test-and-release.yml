name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          type-checking: true
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: check-and-lint
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true

# Deploys the final package to npm — only on a pushed version tag (e.g. v0.0.1),
# never on a branch push.
#
# Prerequisite, outside this repository: a trusted publisher for the package
# `iobroker.e-invoices` in the npm package settings
# (https://docs.npmjs.com/trusted-publishers). The job authenticates through
# OIDC (`id-token: write`), so no NPM_TOKEN secret is used here, and npm
# generates the provenance statement.
# Do not push a `v*` tag before that is configured: the job would fail (nothing
# gets published, but the release run turns red). The release order is written
# down in PROJECT_STATUS.md, section 5.

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Write permissions are required to create Github releases
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          # The checker requires at least Node 24 for the publishing job (E3022).
          node-version: '24.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Sentry is not used by this adapter, so the block stays disabled.
          # To enable error reporting, add the SENTRY_AUTH_TOKEN secret and uncomment:
          # sentry: true
          # sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # sentry-project: "iobroker-e-invoices"
          # sentry-version-prefix: "iobroker.e-invoices"
          # sentry-sourcemap-paths: "build/"
          # sentry-github-integration: true

# ---------------------------------------------------------------------------
# TEMPORÄR (30.09.2026) — nur zur Fehlersuche am Trusted-Publishing-Pfad.
# Tauscht den GitHub-OIDC-Token direkt gegen einen npm-Publish-Token und gibt
# die Antwort der Registry als Check-Annotation aus (ohne Login lesbar).
# Läuft NUR bei Branch-Pushes, publiziert nichts. Wird nach der Diagnose
# wieder entfernt.
# ---------------------------------------------------------------------------
  oidc-diagnose:
    if: |
      github.event_name == 'push' &&
      !startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Trusted-Publishing-Token-Austausch pruefen
        shell: bash
        run: |
          set -u
          URL_SET="nein"; [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && URL_SET="ja"
          TOK_SET="nein"; [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && TOK_SET="ja"
          echo "id-token env: url=$URL_SET token=$TOK_SET"
          if [ "$URL_SET" = "nein" ] || [ "$TOK_SET" = "nein" ]; then
            echo "::error::id-token:write greift nicht — ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN fehlen"
            exit 0
          fi
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r '.value // ""')
          echo "id_token_length=${#IDTOKEN}"
          # Claims des OIDC-Tokens dekodieren (nicht geheim) und als Annotation ausgeben:
          # zeigt, ob GitHub den "immutable subject"-Format nutzt (repo:owner@id/repo@id:...)
          PAYLOAD=$(echo "$IDTOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{ l=length($0)%4; if (l==2) $0=$0"=="; else if (l==3) $0=$0"="; print }' | base64 -d 2>/dev/null || true)
          echo "--- claims ---"; echo "$PAYLOAD"
          CLAIMS=$(echo "$PAYLOAD" | jq -c '{iss,sub,repository,repository_owner,repository_id,repository_visibility,workflow_ref,job_workflow_ref,event_name,environment,runner_environment}' 2>/dev/null || echo "$PAYLOAD")
          echo "::warning::oidc-claims=$CLAIMS"
          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $IDTOKEN" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/iobroker.e-invoices)
          echo "exchange_http=$HTTP"
          echo "--- body ---"; cat /tmp/resp.json; echo
          if jq -e '.token' /tmp/resp.json >/dev/null 2>&1; then
            echo "::notice::TP-Austausch OK (http=$HTTP), Token erhalten — Konfiguration passt"
          else
            MSG=$(tr -d '\n' < /tmp/resp.json | head -c 900)
            echo "::error::exchange_http=$HTTP body=$MSG"
          fi

