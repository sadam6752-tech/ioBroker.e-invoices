# Automatically merge Dependabot PRs when version comparison is within the range
# that is configured in .github/auto-merge.yml

name: Auto-Merge Dependabot PRs

on:
  # WARNING: This needs to be run in the PR base, DO NOT build untrusted code in this action
  # details under https://github.blog/changelog/2021-02-19-github-actions-workflows-triggered-by-dependabot-prs-will-run-with-read-only-permissions/
  pull_request_target:

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The action needs both scopes explicitly: repositories created since 2023
    # default to a read-only GITHUB_TOKEN, so without this block the merge is
    # refused (it cannot be taken from the repository default).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if PR should be auto-merged
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The action reads `.github/auto-merge.yml` by default (that is where the
          # rules live) and would merge with a merge commit otherwise — the repo
          # history stays linear only with an explicit `squash`.
          config-file-path: ".github/auto-merge.yml"
          merge-method: "squash"
