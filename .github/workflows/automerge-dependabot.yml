# Automatically merge Dependabot PRs when version comparison is within the range
# that is configured in .github/auto-merge.yml

name: Auto-Merge Dependabot PRs

on:
  # pull_request, not pull_request_target: GitHub blocks pull_request_target for PRs from forks by
  # default from 02.11.2026. Workflows run for PRs created by Dependabot get write access through the
  # permissions block below anyway; the if limits the job to Dependabot.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The action needs both scopes explicitly: repositories created since 2023
    # default to a read-only GITHUB_TOKEN, so without this block the merge is
    # refused (it cannot be taken from the repository default).
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No own checkout: the action checks out the base branch itself (ref: base.ref) and reads
      # .github/auto-merge.yml from there. An own checkout on pull_request would fetch the PR state.
      - name: Check if PR should be auto-merged
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The action reads `.github/auto-merge.yml` by default (that is where the
          # rules live) and would merge with a merge commit otherwise — the repo
          # history stays linear only with an explicit `squash`.
          config-file-path: ".github/auto-merge.yml"
          merge-method: "squash"
