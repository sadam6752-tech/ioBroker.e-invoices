# Configure here which dependency updates should be merged automatically.
#
# Production patches are merged automatically only for the dependencies listed by name below.
# The libraries that write the invoice (better-sqlite3, pdfkit, pdf-lib, jszip, express and the
# XML/PDF library @stackforge-eu/factur-x) are left out on purpose: a compromised patch release there
# would reach the release branch without a review (supply chain), and the tag deploys to npm
# automatically. Their updates come as pull requests and are merged by hand.
- match:
    dependency_type: production
    dependency_name: "@iobroker/adapter-core"
    update_type: "semver:patch"
- match:
    dependency_type: production
    dependency_name: express-rate-limit
    update_type: "semver:patch"
- match:
    dependency_type: production
    dependency_name: helmet
    update_type: "semver:patch"
- match:
    dependency_type: production
    dependency_name: exceljs
    update_type: "semver:patch"
- match:
    # Except for security fixes, here we allow minor patches
    dependency_type: production
    update_type: "security:minor"
- match:
    # and development dependencies can have a minor update, too
    dependency_type: development
    update_type: "semver:minor"

# The syntax is based on the legacy dependabot v1 automerged_updates syntax, see:
# https://dependabot.com/docs/config-file/#automerged_updates
